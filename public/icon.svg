<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Pedros Stylized 'P' & POS symbol inside safe zone -->
  <g filter="url(#shadow)" transform="translate(136, 106)">
    <!-- Main stem of P -->
    <rect x="20" y="20" width="52" height="260" rx="26" fill="url(#pGrad)" />
    <!-- Loop of P -->
    <path d="M 46 20 H 140 C 196 20 236 60 236 120 C 236 180 196 220 140 220 H 46 Z" fill="url(#pGrad)" />
    <!-- Hole inside P -->
    <path d="M 72 68 H 136 C 168 68 188 92 188 120 C 188 148 168 172 136 172 H 72 Z" fill="#1e3a8a" />
  </g>

  <!-- Small star / sparkle badge at bottom-right of P -->
  <circle cx="360" cy="330" r="42" fill="#38bdf8" filter="url(#shadow)" />
  <path d="M 360 306 L 366 324 L 384 330 L 366 336 L 360 354 L 354 336 L 336 330 L 354 324 Z" fill="#ffffff" />

  <!-- POS indicator dots -->
  <circle cx="176" cy="410" r="10" fill="#60a5fa" />
  <circle cx="216" cy="410" r="10" fill="#93c5fd" />
  <circle cx="256" cy="410" r="10" fill="#bfdbfe" />
  <text x="336" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">POS</text>
</svg>
